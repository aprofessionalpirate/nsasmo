services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
      pull: true
    # Local-only unless the user explicitly selects a LAN interface.
    ports:
      - "${RELAY_BIND_IP:-127.0.0.1}:5080:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
